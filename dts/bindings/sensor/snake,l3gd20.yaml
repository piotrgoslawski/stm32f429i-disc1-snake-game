description: |
  L3GD20 / I3G4250D MEMS gyroscope on the stm32f429i_disc1 board (rev D01
  ships the L3GD20, WHO_AM_I 0xD4; rev E01+ ships the register-compatible
  I3G4250D, WHO_AM_I 0xD3 -- the board in use is the latter), driven
  directly by app code (src/l3gd20.c) rather than an in-tree Zephyr sensor
  driver: Zephyr's i3g4250d driver rejects the L3GD20's id, and the app
  driver handles both parts. This binding only exists to give the app a struct spi_dt_spec via
  DT_NODELABEL(l3gd20); it has no driver bound to "snake,l3gd20".

compatible: "snake,l3gd20"

include: [spi-device.yaml]
