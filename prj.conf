# Peripherals used by the game.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
# Framebuffer format consumed by display_write(): the app writes RGB565
# pixels (snake_render.c). This is already the Kconfig default, but pin it
# so the renderer's colour constants cannot silently drift. (Do not set
# &ltdc pixel-format in app.overlay: that is the LTDC->panel output format
# and must stay RGB_888.)
CONFIG_STM32_LTDC_RGB565=y

# Logging (deferred by default); tilt.h's angle line stays at DBG so it is
# silent unless the build/console log level is raised.
CONFIG_LOG=y

# tilt.c runs on floats on the M4F FPU; float args are also passed to
# LOG_INF/LOG_DBG format strings.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Default (1024) is too small for the game state + Tilt/L3GD20 locals that
# main() keeps on the stack across the whole superloop.
CONFIG_MAIN_STACK_SIZE=4096

# CONFIG_MEMC is NOT set here: the stm32f429i_disc1 board's own
# Kconfig.defconfig does `config MEMC \n default y if STM32_LTDC`, and
# STM32_LTDC defaults to y whenever CONFIG_DISPLAY=y sees the board's LTDC
# node enabled -- confirmed from a successful `west build` of
# zephyr/samples/drivers/display for this board, whose generated .config
# has CONFIG_MEMC=y with a prj.conf containing only CONFIG_LOG=y and
# CONFIG_DISPLAY=y. Setting it here would be redundant.

# No shell, no touch/input, no USB (out of scope for this port).
